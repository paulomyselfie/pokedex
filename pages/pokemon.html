<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pokédex</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="detalhes-pokemon">
        <!-- Cabeçalho -->
         <header class="cabecalho">

            <a href="index.html">
                Voltar
            </a>

            <h1>Pokédex</h1>
         </header>

         <!-- Nome do Pokémon -->
          <section class="pokemon-nome">

            <h2 id="nome-pokemon">
                Charmander
            </h2>
            
            <span id="tipo-pokemon">
                Fogo
            </span>
          </section>

          <!-- Imagem do Pokémon -->
          <section class="pokemon-imagem">
            <img
              id="imagem-pokemon"
              src="images/charmander.png" width="250px"
              alt="Charmander">
          </section>

          <!-- Informações do Pokémon -->
          <section class="informacoes">

            <div class="dados">

                <p>
                    ID:
                    <span id="id-pokemon">#004</span>
                </p>

                <p>
                    Altura:
                    <span id="altura-pokemon">0.6 m</span>
                </p>

                <p>
                    Peso:
                    <span id="peso-pokemon">8.5 kg</span>
                </p>

                <p>
                    Habilidades:
                    <span id="habilidades-pokemon">Fogo</span>
                </p>
            </div>

            <!-- Status -->
             <div class="status">
                <h3>Status</h3>

                <p>
                    HP:
                    <progress id="hp" value="39" max="100"></progress>
                </p>

                <p>
                    Ataque:
                    <progress id="ataque" value="52" max="100"></progress>
                </p>

                <p>
                    Defesa:
                    <progress id="defesa" value="43" max="100"></progress>
                </p>

            </div>
          </section>

          <!--XP -->
          <section class="experiencia">
            <h3>Experiência</h3>

            <p>
                XP:
                <span id="xp">0</span>/100
            </p>

            <progress
                id="barra-xp"
                value="0"
                max="100">
            </progress>

          </section>

          <!--Alimentação-->
          <section class="alimentacao">

            <p>
                Comida disponível:
                <span id="comida">3</span>
            </p>

            <button id="botao-alimentar">
                ALIMENTAR
            </button>

            <p id="mensagem"></p>
          </section>

          <!-- Evolução --->
           <section class="evolucao">
            <h3>Evolução</h3>

            <div class="cadeia-evolucao">

             <div>
                <img
                  src="images/charmander.png" width="100px"
                  alt="Charmander">

                <p>Charmander</p>
             </div>

            <span> -> </span>

                <div>
                    <img
                    src="images/charmeleon.png" width="100px"
                    alt="Charmeleon">
    
                    <p>Charmeleon</p>
                </div>

                <span> -> </span>

                <div>
                    <img
                    src="images/charizard.png" width="100px"
                    alt="Charizard">

                    <p>Charizard</p>
                </div>
           </div>

        </section>
    </main>

    <script src="js/script.js"></script>
  
</body>
</html>
